name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Astro and TypeScript
        run: pnpm check

      - name: Verify unused image deletion guards
        run: |
          node --experimental-vm-modules scripts/verify-image-cleanup.mjs
          node scripts/verify-d1-routes.mjs

      - name: Build static site and search index
        run: pnpm build

      - name: Deploy CMS to Cloudflare
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.140.0'
          command: deploy --config wrangler.cms.jsonc --env=""

      - name: Deploy site to Cloudflare
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.140.0'
          command: deploy --env=""
