name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Astro and TypeScript
        run: pnpm check

      - name: Verify unused image deletion guards
        run: |
          node --experimental-vm-modules scripts/verify-image-cleanup.mjs
          node scripts/verify-d1-routes.mjs
          node scripts/verify-series-pagination.mjs
          pnpm verify:content

      - name: Build static site
        env:
          SITE_URL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'https://seungjun.sh' || '' }}
          ALLOW_INDEXING: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ALLOW_INDEXING || '' }}
          GA4_DEPLOY_TARGET: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || '' }}
          GA4_PRODUCTION_ENABLED: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GA4_PRODUCTION_ENABLED == 'true' && 'true' || '' }}
          GA4_PRODUCTION_MEASUREMENT_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GA4_PRODUCTION_ENABLED == 'true' && vars.GA4_PRODUCTION_MEASUREMENT_ID || '' }}
          PUBLIC_GA_MEASUREMENT_ID: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GA4_PRODUCTION_ENABLED == 'true' && vars.GA4_PRODUCTION_MEASUREMENT_ID || '' }}
        run: pnpm build

      - name: Verify GA4 analytics guards
        env:
          GA4_EXPECTED_TARGET: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GA4_PRODUCTION_ENABLED == 'true' && vars.ALLOW_INDEXING == 'true' && 'production' || 'disabled' }}
        run: |
          node scripts/verify-analytics.mjs
          node scripts/verify-analytics-runtime.mjs

      - name: Verify D1 search, retired paths and security guards
        run: |
          pnpm verify:search
          pnpm verify:security

      - name: Deploy CMS to Cloudflare
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.140.0'
          command: deploy --config wrangler.cms.jsonc --env=""

      - name: Deploy site to Cloudflare
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.140.0'
          command: deploy --env=""

      - name: Verify production deployment
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
        run: node scripts/verify-deployment.mjs
